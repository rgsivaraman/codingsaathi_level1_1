databases:
  # PostgreSQL Database
  - name: agent-marketplace-db
    databaseName: agent_marketplace
    user: postgres
    plan: free
    region: oregon

services:
  # Backend API
  - type: web
    name: agent-marketplace-backend
    env: docker
    region: oregon
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: agent-marketplace-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://agent-marketplace-frontend.onrender.com
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 30
    healthCheckPath: /health

  # Frontend
  - type: web
    name: agent-marketplace-frontend
    env: docker
    region: oregon
    plan: free
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      - key: REACT_APP_API_URL
        value: https://agent-marketplace-backend.onrender.com
